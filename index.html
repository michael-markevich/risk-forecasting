      # Риск для инженеров
      ### Измеряем, как уменьшается количество «_плохих вещей_» в нашем будущем

      ---

      ## Сначала: что не так?

      --

      ### Когда люди гадают, у них куча смещений. [Исследования](https://machinelearnings.co/why-are-we-so-confident-2c3151a6d5d0) с этим согласны.

      --

      ### [Десятилетие исследований](https://www.amazon.com/Expert-Political-Judgment-Good-Know/dp/0691128715) показывает, что эксперты до смешного слабы в прогнозах.

      --

      ### Риск связан с вероятностью будущих событий.

      --

      ### Как «эксперты», мы обычно .red[хуже] предсказываем риски.

      --

      ### Этот факт основан на исследованиях, удостоенных Нобелевской премии.

      --

      ### Эти исследования воспроизводятся с [забавными результатами](https://en.wikipedia.org/wiki/Thinking,_Fast_and_Slow) в подтверждающих работах.

      ---
      template: inverse
      layout: true
      ---

      ### Возможно, это одна из причин, почему мы так плохо предотвращаем взломы.

      ---

      ### Риск по своей природе — это вероятностная тема, требующая предсказания.

      --

      ### Но эти выводы показывают, что оценка риска может быть ненадёжной.

      ---

      ### И всё же мы намерены снижать риски. Мы _зависим_ от своей способности понимать риск.

      ---

      ### Так что мы остаёмся экспертами с необходимостью предсказывать риск…

      --

      ### …и наукой, которая намекает: [с предсказаниями экспертов есть проблемы](https://www.sas.upenn.edu/tetlock/publications).

      ---

      ## Эта проблема широко распространена в нашей индустрии.

      ---

      ### Но есть надежда!

      ---

      ## Другие исследования предлагают методы, которые _улучшают_ прогнозирование.

      ---

      ### Прогнозирование может быть строгим процессом, который защищает от этих ошибок.

      ---

      ## Индустрии с высоким риском полагаются на вероятностные подходы к риску.

      --

      ### [Космос](https://ntrs.nasa.gov/archive/nasa/casi.ntrs.nasa.gov/20120001369.pdf), [ядерная энергетика](https://www.nrc.gov/about-nrc/regulatory/risk-informed/pra.html), [нефть](https://www.bsee.gov/sites/bsee.gov/files/interagency-agreements-mous-moas//nasa-bsee-iaa-1-28-16.pdf), [экология](https://www.epa.gov/risk/policy-use-probabilistic-analysis-risk-assessment-epa)

      --

      ### Почему-то у нас эти методы так не ценят.

      ---

      ## Прогнозирование заполняет пробелы там, где «_У нас нет данных!_»

      --

      ### Оказывается, в любой другой индустрии это не считается уважительной причиной.

      ---

      ## Перенять привычки [эффективных прогнозистов](https://www.amazon.com/Superforecasting-Science-Prediction-Philip-Tetlock-ebook/dp/B00RKO6MS8) несложно.

      --

      ### Они существуют! Их активно изучают. Десятилетиями.

      ---

      ## Эти методы легко перенять, и у них есть измеримый результат.

      ---

      ### Это значит, что строгие прогнозы могут быть достаточно полезны для решений о риске.

      --

      ### Те .green[4%] могут оказаться надёжной величиной…

      --

      ### …а не ощущаться одноразовой догадкой.
